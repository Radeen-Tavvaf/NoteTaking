<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteTaking Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&family=JetBrains+Mono:wght@400;500;700&family=Patrick+Hand&family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-theme="violet">
    <div class="app-shell">
      <!-- The sidebar handles navigation and filtering without leaving the editor. -->
      <aside class="sidebar">
        <div class="brand-card">
          <div class="brand-badge">N</div>
          <div>
            <h1>NoteTaking</h1>
            <small>Private notes on-device</small>
          </div>
        </div>

        <a href="index.html" class="button" style="display: inline-block; text-align: center;">Home</a>
        <button id="new-note-btn" class="button" type="button">+ New note</button>

        <div class="sidebar-section">
          <label class="search-box" for="search-input">
            <span>Search</span>
            <input id="search-input" class="input" type="search" placeholder="Search notes..." />
          </label>
        </div>

        <div class="sidebar-section" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <label>
            <span>Folder</span>
            <select id="folder-filter">
              <option value="all">All folders</option>
              <option value="General">General</option>
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Ideas">Ideas</option>
            </select>
          </label>

          <label>
            <span>Sort</span>
            <select id="sort-select">
              <option value="updated-desc">Updated</option>
              <option value="created-desc">Created</option>
              <option value="alpha">A–Z</option>
              <option value="tags-alpha">Tags A–Z</option>
              <option value="tags-count">Most tags</option>
              <option value="pinned">Pinned</option>
            </select>
          </label>
        </div>

        <div class="sidebar-section tag-filter-section">
          <label>
            <span>Include tags</span>
            <input id="include-tags" class="input" type="text" placeholder="research, draft" />
          </label>
          <label>
            <span>Exclude tags</span>
            <input id="exclude-tags" class="input" type="text" placeholder="archived, private" />
          </label>
        </div>

        <div class="sidebar-section">
          <div class="section-header">
            <span>Notes</span>
            <span id="note-count" class="muted-badge">0</span>
          </div>
          <div id="note-list" class="note-list" aria-live="polite"></div>
        </div>
      </aside>

      <main class="content-panel">
        <div class="privacy-banner">Your notes never leave your device.</div>

        <!-- Toolbar controls affect the selected note or selected editor content. -->
        <div class="editor-shell">
          <header class="topbar">
            <input id="note-title" type="text" placeholder="Untitled note" aria-label="Note title" />
            <div class="quick-actions">
              <button id="toggle-focus" class="secondary-button" type="button">Focus mode</button>
              <button id="pin-note" class="secondary-button" type="button">Pin</button>
            </div>
          </header>

          <div class="toolbar-row">
            <div class="toolbar-group">
              <button class="toolbar-button" data-command="bold" type="button"><strong>B</strong></button>
              <button class="toolbar-button" data-command="italic" type="button"><em>I</em></button>
              <button class="toolbar-button" data-command="underline" type="button"><span style="text-decoration: underline;">U</span></button>
              <button class="toolbar-button" data-command="insertUnorderedList" type="button">• List</button>
              <button class="toolbar-button" data-command="insertOrderedList" type="button">1. List</button>
              <button class="toolbar-button" data-command="formatBlock" data-value="h1" type="button">H1</button>
              <button class="toolbar-button" data-command="formatBlock" data-value="h2" type="button">H2</button>
              <button class="toolbar-button" data-command="insertHorizontalRule" type="button">—</button>

              <div class="palette-control">
                <button class="toolbar-button palette-trigger" data-palette-toggle="text-color-palette" type="button" aria-haspopup="true" aria-expanded="false" title="Text color">
                  <span class="text-color-icon">A</span>
                  <span class="sr-only">Text color</span>
                </button>
                <div id="text-color-palette" class="color-palette hidden" role="menu" aria-label="Text color choices">
                  <button class="color-swatch color-swatch-reset" data-color-command="foreColor" data-color-value="inherit" data-color-label="Default text color" type="button" title="Default text color" aria-label="Default text color">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#000000" data-color-label="Black" type="button" title="Black" aria-label="Black" style="--swatch-color: #000000;">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#434343" data-color-label="Dark gray" type="button" title="Dark gray" aria-label="Dark gray" style="--swatch-color: #434343;">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#666666" data-color-label="Gray" type="button" title="Gray" aria-label="Gray" style="--swatch-color: #666666;">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#980000" data-color-label="Dark red" type="button" title="Dark red" aria-label="Dark red" style="--swatch-color: #980000;">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#ff0000" data-color-label="Red" type="button" title="Red" aria-label="Red" style="--swatch-color: #ff0000;">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#ff9900" data-color-label="Orange" type="button" title="Orange" aria-label="Orange" style="--swatch-color: #ff9900;">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#ffff00" data-color-label="Yellow" type="button" title="Yellow" aria-label="Yellow" style="--swatch-color: #d6a700;">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#008000" data-color-label="Green" type="button" title="Green" aria-label="Green" style="--swatch-color: #008000;">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#00a6a6" data-color-label="Teal" type="button" title="Teal" aria-label="Teal" style="--swatch-color: #00a6a6;">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#1155cc" data-color-label="Blue" type="button" title="Blue" aria-label="Blue" style="--swatch-color: #1155cc;">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#674ea7" data-color-label="Purple" type="button" title="Purple" aria-label="Purple" style="--swatch-color: #674ea7;">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#a61c00" data-color-label="Brown" type="button" title="Brown" aria-label="Brown" style="--swatch-color: #a61c00;">A</button>
                  <button class="color-swatch" data-color-command="foreColor" data-color-value="#c90076" data-color-label="Pink" type="button" title="Pink" aria-label="Pink" style="--swatch-color: #c90076;">A</button>
                </div>
              </div>

              <div class="palette-control">
                <button class="toolbar-button palette-trigger" data-palette-toggle="highlight-palette" type="button" aria-haspopup="true" aria-expanded="false" title="Highlight color">
                  <span class="highlight-icon">A</span>
                  <span class="sr-only">Highlight color</span>
                </button>
                <div id="highlight-palette" class="color-palette highlight-palette hidden" role="menu" aria-label="Highlight color choices">
                  <button class="color-swatch highlight-swatch-reset" data-color-command="hiliteColor" data-color-value="transparent" data-color-label="No highlight" type="button" title="No highlight" aria-label="No highlight">A</button>
                  <button class="color-swatch" data-color-command="hiliteColor" data-color-value="#fff2cc" data-color-label="Yellow highlight" type="button" title="Yellow highlight" aria-label="Yellow highlight" style="--swatch-color: #fff2cc;">A</button>
                  <button class="color-swatch" data-color-command="hiliteColor" data-color-value="#fce5cd" data-color-label="Orange highlight" type="button" title="Orange highlight" aria-label="Orange highlight" style="--swatch-color: #fce5cd;">A</button>
                  <button class="color-swatch" data-color-command="hiliteColor" data-color-value="#d9ead3" data-color-label="Green highlight" type="button" title="Green highlight" aria-label="Green highlight" style="--swatch-color: #d9ead3;">A</button>
                  <button class="color-swatch" data-color-command="hiliteColor" data-color-value="#d0e0e3" data-color-label="Teal highlight" type="button" title="Teal highlight" aria-label="Teal highlight" style="--swatch-color: #d0e0e3;">A</button>
                  <button class="color-swatch" data-color-command="hiliteColor" data-color-value="#c9daf8" data-color-label="Blue highlight" type="button" title="Blue highlight" aria-label="Blue highlight" style="--swatch-color: #c9daf8;">A</button>
                  <button class="color-swatch" data-color-command="hiliteColor" data-color-value="#d9d2e9" data-color-label="Purple highlight" type="button" title="Purple highlight" aria-label="Purple highlight" style="--swatch-color: #d9d2e9;">A</button>
                  <button class="color-swatch" data-color-command="hiliteColor" data-color-value="#ead1dc" data-color-label="Pink highlight" type="button" title="Pink highlight" aria-label="Pink highlight" style="--swatch-color: #ead1dc;">A</button>
                </div>
              </div>
            </div>

            <div class="toolbar-group">
              <label>
                <span>Site theme</span>
                <select id="theme-select">
                  <option value="violet">Violet</option>
                  <option value="teal">Teal</option>
                  <option value="gold">Gold</option>
                  <option value="rose">Rose</option>
                  <option value="dark">Dark</option>
                </select>
              </label>

              <label class="site-background-control">
                <span>Background</span>
                <input id="site-background" type="color" value="#f6f4ff" title="Choose site background color" />
              </label>

              <label>
                <span>Font</span>
                <select id="font-select">
                  <option value="Inter, sans-serif">Inter</option>
                  <option value="Georgia, serif">Georgia</option>
                  <option value='"JetBrains Mono", monospace'>JetBrains Mono</option>
                  <option value='"Patrick Hand", cursive'>Patrick Hand</option>
                  <option value='"Playfair Display", serif'>Playfair Display</option>
                  <option value='"Montserrat", sans-serif'>Montserrat</option>
                  <option value='"Cormorant Garamond", serif'>Cormorant Garamond</option>
                  <option value='"DM Serif Text", serif'>DM Serif Text</option>
                  <option value='"Libre Baskerville", serif'>Libre Baskerville</option>
                </select>
              </label>

              <label>
                <span>Size</span>
                <input id="font-size" type="number" min="8" max="96" step="1" value="18" />
              </label>

              <label>
                <span>Line height</span>
                <input id="line-height" type="number" min="0.8" max="4" step="0.1" value="1.6" />
              </label>
            </div>
          </div>
        </div>

        <!-- Metadata is stored alongside the note body in IndexedDB. -->
        <div class="note-config">
          <label style="flex: 1; min-width: 180px;">
            <span>Folder</span>
            <div class="folder-inline-row">
              <select id="folder-select" class="input"></select>
              <button id="add-folder-btn" class="secondary-button compact-button" type="button" title="Add custom folder">+</button>
            </div>
          </label>
          <input id="add-folder-input" class="input compact-folder-input hidden" type="text" placeholder="New folder name" />
          <label>
            <span>Tags</span>
            <input id="tag-input" class="input" type="text" list="tag-suggestions" placeholder="Tags separated by commas" />
            <datalist id="tag-suggestions">
              <option value="New"></option>
              <option value="Favorite"></option>
              <option value="Notes"></option>
              <option value="Ideas"></option>
              <option value="Draft"></option>
              <option value="Archived"></option>
            </datalist>
          </label>
          <div id="tag-list" class="tag-list"></div>
        </div>

        <!-- editor.js owns the editable HTML and autosaves changes after a short delay. -->
        <div class="editor-wrap">
          <div id="editor" class="editor" contenteditable="true" spellcheck="true"></div>
        </div>

        <!-- Export and import actions operate on the selected note or the full backup. -->
        <footer class="footer-bar">
          <div class="stats">
            <span id="word-count">0 words</span>
            <span id="character-count">0 characters</span>
            <span id="reading-time">0 min read</span>
            <span id="save-status">Autosaved locally</span>
          </div>

          <div class="export-actions">
            <button id="export-json" class="secondary-button" type="button">Export JSON</button>
            <button id="export-md" class="secondary-button" type="button">Export .md</button>
            <button id="export-txt" class="secondary-button" type="button">Export .txt</button>
            <button id="export-pdf" class="secondary-button" type="button">Export PDF</button>
            <button id="import-btn" class="secondary-button" type="button">Import</button>
            <input id="import-json" type="file" accept="application/json" class="hidden" />
          </div>
        </footer>
      </main>
    </div>

    <script type="module" src="js/editor.js"></script>
  </body>
</html>
